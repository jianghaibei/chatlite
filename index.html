<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatLite — 轻量版私人 ChatGPT</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">💬 ChatLite</div>
    <button id="newChat">＋ 新对话</button>
    <div class="side-title">历史对话</div>
    <div id="sessionList"></div>
    <div class="side-title">面具助手 🎭</div>
    <div id="maskList"></div>
  </aside>
  <main>
    <header>
      <span id="chatTitle">新对话</span>
      <span class="head-btns">
        <button id="exportBtn" title="导出 Markdown">📤 导出</button>
        <button id="themeBtn" title="深色/浅色">🌙</button>
        <button id="settingsBtn">⚙️ 设置</button>
      </span>
    </header>
    <div id="messages"></div>
    <div id="slashMenu" class="hidden"></div>
    <div id="composer">
      <textarea id="input" rows="2" placeholder="输入消息，Enter 发送，Shift+Enter 换行；输入 / 调用提示词…"></textarea>
      <button id="sendBtn">发送</button>
    </div>
    <div class="hint">演示模式：未填 API Key 时回复为演示内容 · 在「设置」填入你的 OpenAI API Key 后即为真实对话 · 数据只存本地浏览器</div>
  </main>
</div>
<div id="settingsModal" class="modal hidden">
  <div class="modal-box">
    <h3>设置</h3>
    <label>OpenAI API Key<input id="apiKey" type="password" placeholder="sk-...（只存本地浏览器）"></label>
    <label>Base URL<input id="baseUrl" type="text" value="https://api.openai.com/v1"></label>
    <label>模型
      <select id="model">
        <option>gpt-4o-mini</option>
        <option>gpt-4o</option>
        <option>gpt-5</option>
        <option>gpt-5-mini</option>
      </select>
    </label>
    <div class="modal-btns"><button id="saveSettings">保存</button><button id="closeSettings">关闭</button></div>
  </div>
</div>
<script src="js/masks.js"></script>
<script src="js/app.js"></script>
</body>
</html>
